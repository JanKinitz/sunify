# Netlify-Konfiguration für Sunify 2.0.
# Next.js wird von Netlify automatisch erkannt (OpenNext-Adapter); API-Routen laufen als Functions.
# Veröffentlicht wird über GitHub Actions (.github/workflows/deploy-netlify.yml) bei jedem Push auf main.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Service Worker und Manifest nie lange zwischenspeichern, damit Updates sofort ankommen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

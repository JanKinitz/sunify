# Veröffentlicht Sunify 2.0 bei jedem Push auf main (und auf Knopfdruck) bei Netlify – in drei Schritten:
#   1. vorschau: bauen und als Vorschau-Version hochladen (kostet bei Netlify keine Credits)
#   2. tests:    komplette Testbibliothek gegen die Vorschau
#   3. live:     nur wenn alle Tests grün sind, genau diese Version live schalten (eine Produktiv-Veröffentlichung)
# Benötigt die Secrets NETLIFY_AUTH_TOKEN und NETLIFY_SITE_ID (legt setup-netlify.bat an).
name: Veröffentlichen (Netlify)

on:
  push:
    branches: [main]
    paths-ignore:
      - "pipeline/**"
      - "**.md"
      - "**.bat"
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

jobs:
  deploy:
    name: vorschau
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.preview.outputs.url }}
      deploy_id: ${{ steps.preview.outputs.deploy_id }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Netlify eingerichtet?
        id: check
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify ist noch nicht eingerichtet (setup-netlify.bat) - Veröffentlichung übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Datenbank-Funktionen aktualisieren (Migrationen)
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install --quiet "psycopg[binary]>=3.2"
          python -m pipeline migrate

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Bauen und als Vorschau hochladen (ohne Credits)
        if: steps.check.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npx --yes netlify-cli@latest deploy --build --site "$NETLIFY_SITE_ID" --alias "v-${GITHUB_SHA::7}" --message "GitHub ${GITHUB_SHA::7}"

      - name: Vorschau-Adresse ermitteln und prüfen
        id: preview
        if: steps.check.outputs.ready == 'true'
        run: |
          npx --yes netlify-cli@latest api listSiteDeploys --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"per_page\":20}" > deploys.json
          read -r ID URL < <(node -e '
            const list = require("./deploys.json");
            const tag = "GitHub " + process.env.GITHUB_SHA.slice(0, 7);
            let d = list.find((x) => x.title === tag && x.state === "ready");
            if (!d) { console.error("Kein Deploy mit Titel " + tag + " - nehme den neuesten fertigen."); d = list.find((x) => x.state === "ready"); }
            if (!d) { console.error("Vorschau-Version nicht gefunden"); process.exit(1); }
            console.log(d.id, d.deploy_ssl_url || d.deploy_url);
          ')
          if [ -z "$ID" ] || [ -z "$URL" ]; then echo "::error::Vorschau-Version nicht gefunden."; exit 1; fi
          echo "Vorschau: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$ID" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/version")
          if [ "$CODE" != "200" ]; then
            echo "::error::Die Vorschau ist nicht öffentlich erreichbar (HTTP $CODE). Bei Netlify unter Project configuration → Access & security → Visitor access den Schutz für Vorschau-Versionen ausschalten."
            exit 1
          fi
          curl -fsS "$URL/api/status" | head -c 800 || true
          echo
          echo "### Vorschau: $URL" >> "$GITHUB_STEP_SUMMARY"

  # Komplette Testbibliothek (e2e/) gegen die Vorschau-Version
  tests:
    needs: deploy
    if: needs.deploy.outputs.url != ''
    uses: ./.github/workflows/e2e.yml
    with:
      url: ${{ needs.deploy.outputs.url }}

  # Alles grün: genau die getestete Version live schalten
  live:
    needs: [deploy, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      DEPLOY_ID: ${{ needs.deploy.outputs.deploy_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Getestete Version live schalten
        run: npx --yes netlify-cli@latest api restoreSiteDeploy --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"deploy_id\":\"$DEPLOY_ID\"}" > /dev/null

      - name: Live-Version prüfen
        run: |
          URL=$(npx --yes netlify-cli@latest api getSite --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.ssl_url||j.url)})')
          for i in $(seq 1 12); do
            if curl -fsS "$URL/api/version" | grep -q "$GITHUB_SHA"; then
              echo "### Sunify 2.0 ist online: $URL (getestete Version ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
              curl -fsS "$URL/api/status" | head -c 800 || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live-Adresse meldet nicht die neue Version ${GITHUB_SHA::7}."
          exit 1

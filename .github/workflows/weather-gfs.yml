# Globale Prognose (NOAA GFS über dynamical.org) – viermal täglich, kurz nach den GFS-Läufen.
name: Wetter weltweit (GFS)

on:
  schedule:
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: GFS laden und speichern
        run: python -m pipeline weather-gfs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

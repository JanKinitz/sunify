# Globale Prognose (NOAA GFS über dynamical.org) – viermal täglich, kurz nach den GFS-Läufen.
name: Wetter weltweit (GFS)

on:
  schedule:
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:
  # Nach Änderungen an der Aufbereitung sofort neu rechnen statt auf den nächsten Termin zu warten
  push:
    branches: [main]
    paths:
      - "pipeline/daily.py"
      - "pipeline/gfs.py"
      - "pipeline/weather.py"

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prüfungen der Datenaufbereitung (Unit-Tests)
        run: python -m unittest discover -s pipeline/tests -t .
      - name: Datenbank-Schema aktualisieren (Migrationen, idempotent)
        run: python -m pipeline migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: GFS laden und speichern
        run: python -m pipeline weather-gfs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

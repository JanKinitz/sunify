# Feinere Prognose für Zentraleuropa (Open-Meteo, u. a. DWD ICON) – einmal täglich.
# Kostenlose Open-Meteo-Schnittstelle: < 10.000 Abrufe/Tag, nur nicht-kommerziell.
# Für kommerzielle Nutzung ein Abo abschließen und den Schlüssel als Secret OPEN_METEO_API_KEY hinterlegen.
name: Wetter Zentraleuropa (Open-Meteo)

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  openmeteo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Open-Meteo laden und speichern
        run: python -m pipeline weather-om
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
